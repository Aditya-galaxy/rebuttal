[project]
name = "rebuttal"
version = "0.1.0"
description = "The dispute deadline agent for small PayPal sellers: watches every dispute's clock, builds the evidence PayPal asks for, and answers before time runs out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "fpdf2>=2.8",
    "python-multipart>=0.0.9",
    "google-auth[requests]>=2.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
rebuttal = "rebuttal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF005"]
